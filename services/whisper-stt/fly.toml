# Deploy: fly deploy --config services/whisper-stt/fly.toml
# Set secrets: fly secrets set WHISPER_STT_SECRET=... --app awaazos-whisper-stt

app = "awaazos-whisper-stt"
primary_region = "bom"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  WHISPER_MODEL = "small"
  WHISPER_DEVICE = "cpu"
  WHISPER_COMPUTE_TYPE = "int8"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
