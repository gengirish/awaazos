<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FF6600" />
    <title>Offline · AwaazOS</title>
    <!-- Served by public/sw.js when a page other than /pos is opened with no
         network. Static and self-contained: no scripts, no external assets. -->
    <style>
      :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #5f5f5f; --bg: #ffffff; --primary: #ff6600; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --muted: #b0b0b0; --bg: #121212; } }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 26rem; padding: 1.5rem 1rem; text-align: center; }
      h1 { font-size: 1.375rem; margin: 0 0 0.5rem; }
      p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1.5rem;
        border-radius: 0.5rem; background: var(--primary); color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page needs internet. Billing still works: sales you ring up are saved on this phone and sync when you're back online.</p>
      <a href="/pos">Open billing</a>
    </main>
  </body>
</html>
