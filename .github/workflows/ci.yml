name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true
  NODE_OPTIONS: --max_old_space_size=4096
  # Boot-required app env vars (dummy values for static checks in CI).
  AUTH_SECRET: ci_dummy_auth_secret_please_override_in_prod
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"
  DATABASE_URL: postgresql://ci:ci@localhost:5432/awaazos?sslmode=disable
  DIRECT_URL: postgresql://ci:ci@localhost:5432/awaazos?sslmode=disable
  REDIS_URL: redis://localhost:6379

jobs:
  quality:
    name: Lint + Type + Unit + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # First-load JS per route, read from the build above (no server, no network).
      # Fails when a route or the shared runtime outgrows perf-budget.json.
      - name: Bundle size budget
        run: npm run perf:budget

  e2e:
    name: E2E (${{ matrix.project }})
    # Pinned: `playwright install --with-deps` has no ubuntu-latest (26.04) support yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: quality
    strategy:
      # One project's failure shouldn't hide the other's.
      fail-fast: false
      matrix:
        project: [chromium, mobile]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: awaazos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d awaazos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/awaazos?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/awaazos?schema=public
      # The internal account that owns demo stores (admin-demo-pipeline.spec.ts builds some).
      DEMO_OWNER_EMAIL: demo-owner@example.test
      # "Sizes or colours" in the item form (lib/item-variants.ts); item-variants.spec.ts tests it.
      ITEM_VARIANTS_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The migrations, not `db push`: this also proves they apply from empty.
      - name: Apply migrations (E2E database)
        run: npx prisma migrate deploy

      - name: Check the migrations match schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # Generated per run: no key in the repo for gitleaks to flag, and it only ever
      # protects rows in this job's throwaway Postgres.
      - name: Generate a throwaway payment-keys secret
        run: echo "PAYMENT_KEYS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Test the production build: `next dev` (on-demand compiles, HMR) has crashed
      # mid-run in CI since Next 15, and prod is what users get anyway.
      - name: Build
        run: npm run build

      - name: Run E2E
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  security:
    name: Secret scan + npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # gitleaks-action lists the PR's commits; without pull-requests: read the
    # token gets "Resource not accessible by integration" and the job fails
    # before npm audit ever runs.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks scan
      # Full-history scan on push and PR.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

